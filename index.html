<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Site Builder</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom styles for header content */
      .site-header-content > h1 {
        line-height: 1.1;
        margin-bottom: 0;
      }
      .site-header-content > p {
        margin-top: 0.1rem;
        font-size: 0.9rem;
        color: #4B5563; /* text-gray-600 */
        line-height: 1.2;
      }
      /* Animation for highlighting a navigated-to tile */
      @keyframes pulse-glow {
        0% {
          box-shadow: 0 0 0 0px rgba(217, 119, 6, 0.7);
        }
        50% {
          box-shadow: 0 0 0 12px rgba(217, 119, 6, 0);
        }
        100% {
          box-shadow: 0 0 0 0px rgba(217, 119, 6, 0);
        }
      }
      .tile-highlight-pulse {
        animation: pulse-glow 7.5s ease-out;
      }
    </style>
  
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
